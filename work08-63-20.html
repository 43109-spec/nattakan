<!DOCTYPE html>
<html lang="th">
<head>
<style>
* {
      box-sizing : border-box;
      margin: 0;
      padding: 0;
}


.box{width:1024px;margin:0 auto;}
header{
background-image:url(images/header.jpg);
height:256px;
}
nav{background-color:pink;height:400px;flex:1}
article{background-color:yellow;height:400px;flex:4}
footer{background-color:red;height:100px;}
section{display:flex;}
</style>
<meta charset="utf-8">
<title>work8 html layout</title>
</head>
<body>
<div class="box">
<header></header>
<section>
<nav></nav>
<article></article>
</section>
<footer></footer>
</div>
</body>
</html>
